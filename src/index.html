<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>RS OmniClip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: `connect-src 'self' ws:` — `ws:` hanya dibutuhkan untuk hot-reload
      Vite saat mode pengembangan (localhost:5173). Di produksi (file://) nilai
      ini inert karena aplikasi tidak melakukan koneksi jaringan apa pun.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
