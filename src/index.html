<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>RS OmniTools</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP: `connect-src 'self' ws:` — `ws:` hanya dibutuhkan untuk hot-reload
      Vite saat mode pengembangan (localhost:5173). `img-src` mengizinkan https/http
      untuk menampilkan thumbnail video yang diambil dari yt-dlp/TikWM. `media-src`
      mengizinkan https/http agar pratinjau video remote (mis. CDN TikTok via
      `preview:resolve`) bisa diputar di <video> — sebelumnya hanya `blob:` sehingga
      preview remote DIBLOKIR (readyState 0, tanpa error). `media:` ditambahkan untuk
      protokol kustom `media://` (pratinjau video hasil unduhan lokal). `font-src
      'self' data:` — subset font (mis. Cyrillic) yang di-inline Vite sebagai data:URI
      tidak diblokir (font-src default mengikuti default-src 'self' → error konsol).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http: media:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
