<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RS OmniTools — Cookie Capturer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.439 7.85c-.049.322.059.648.289.878l1.568 1.568c.47.47.706 1.087.706 1.704s-.235 1.233-.706 1.704l-1.611 1.611a.98.98 0 0 1-.837.276c-.47-.07-.802-.48-.968-.925a2.501 2.501 0 1 0-3.214 3.214c.446.166.855.497.925.968a.979.979 0 0 1-.276.837l-1.61 1.61a2.404 2.404 0 0 1-1.705.707 2.402 2.402 0 0 1-1.704-.706l-1.568-1.568a1.026 1.026 0 0 0-.877-.29c-.493.074-.84.504-1.02.968a2.5 2.5 0 1 1-3.237-3.237c.464-.18.894-.527.967-1.02a1.026 1.026 0 0 0-.289-.877l-1.568-1.568A2.402 2.402 0 0 1 1.998 12c0-.617.236-1.234.706-1.704L4.315 8.685c.31-.304.705-.434 1.1-.352.493.102.848.418 1.064.822.18.465.524.886 1.02.968a1.026 1.026 0 0 0 .877-.29l1.568-1.568a2.402 2.402 0 0 1 1.704-.706c.617 0 1.234.236 1.704.706l1.568 1.568c.23.23.556.338.877.29.493-.074.84-.504 1.02-.968a2.5 2.5 0 1 1 3.237 3.237c-.464.18-.894.527-.967 1.02Z"/>
          </svg>
        </div>
        <div class="title">
          <h1>RS OmniTools</h1>
          <span>Cookie Capturer</span>
        </div>
      </div>
      <span class="pill" id="statusDot">Terhubung</span>
    </header>

    <section class="card">
      <div class="field">
        <label for="site">Situs cookie</label>
        <select id="site">
          <option value="douyin" selected>Douyin (douyin.com)</option>
          <option value="tiktok">TikTok (tiktok.com)</option>
        </select>
      </div>

      <button id="capture" class="btn primary" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 4l10 10-4 4-10-10L14 4z"/><path d="M5 19l-2 2"/><path d="M14 4l-4 4"/><path d="M10 8l-4 4"/>
        </svg>
        Ambil &amp; Kirim Cookie
      </button>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div class="divider"></div>

      <div class="field">
        <label for="code">Kode hubung aplikasi</label>
        <div class="code-row">
          <input id="code" type="text" placeholder="port:token" spellcheck="false" autocomplete="off" />
          <button id="saveCode" class="btn ghost" type="button">Simpan</button>
        </div>
        <p class="hint">Buka aplikasi RS OmniTools → Pengaturan Unduhan → bagian "Isi otomatis via ekstensi" → salin kode lalu tempel di sini.</p>
      </div>

      <div class="actions">
        <button id="check" class="btn ghost" type="button">Cek koneksi</button>
        <button id="copy" class="btn ghost" type="button">Salin cookie</button>
      </div>
    </section>

    <footer class="foot">
      <span>Cookie dikirim hanya ke 127.0.0.1 — tidak ke server mana pun.</span>
      <span class="ver" id="ver"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
